apiVersion: v1
kind: Pod
metadata:
  name: benchmark-validator
  labels:
    anfa.dev/component: step4-validation
spec:
  restartPolicy: Never
  nodeSelector:
    anfa.dev/role: infrastructure
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: curl
      image: anfa/benchmark-validator:0.1.0
      imagePullPolicy: IfNotPresent
      env:
        - {name: TARGET_URL, value: "http://benchmark-app:8080/work"}
        - {name: REQUESTS, value: "2000"}
        - {name: CONCURRENCY, value: "64"}
      resources:
        requests: {cpu: "50m", memory: "32Mi"}
        limits: {cpu: "500m", memory: "128Mi"}
